<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ai.rest2build.lol — 人去 rest，AI 去 build</title>
    <meta
      name="description"
      content="Rest2Build：面向开发者的多模型 API 兼容接入站。官方 API 兼容接入、多模型直连、Codex CLI 与 Claude Code 接入指导、用量管理与企业技术服务。"
    />
    <link rel="canonical" href="https://ai.rest2build.lol/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="rest2build" />
    <meta property="og:title" content="rest2build — 人去 rest，AI 去 build" />
    <meta property="og:description" content="官方 API 兼容接入，多模型直连与开发接入支持，立即开始体验。" />
    <meta property="og:url" content="https://ai.rest2build.lol/" />
    <meta property="og:image" content="https://ai.rest2build.lol/logo.svg" />
    <meta name="twitter:card" content="summary" />
    <meta name="robots" content="index,follow" />
    <script nonce="__SUB2API_CSP_NONCE__">
      ;(() => {
        try {
          document.documentElement.classList.toggle('dark', localStorage.getItem('theme') !== 'light')
          const savedLocale = localStorage.getItem('sub2api_locale')
          const locale = savedLocale === 'zh' || savedLocale === 'en'
            ? savedLocale
            : (navigator.language || '').toLowerCase().startsWith('zh') ? 'zh' : 'en'
          document.documentElement.setAttribute('data-home-locale', locale)
          document.documentElement.setAttribute('lang', locale)
        } catch {
          document.documentElement.classList.add('dark')
          document.documentElement.setAttribute('data-home-locale', 'en')
          document.documentElement.setAttribute('lang', 'en')
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"><!-- Production builds emit the complete static home templates under /home/. --></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

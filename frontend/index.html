    <script nonce="__SUB2API_CSP_NONCE__">
      ;(() => {
        try {
          document.documentElement.classList.toggle('dark', localStorage.getItem('theme') !== 'light')
          const savedLocale = localStorage.getItem('sub2api_locale')
          const locale = savedLocale === 'zh' || savedLocale === 'en'
            ? savedLocale
            : (navigator.language || '').toLowerCase().startsWith('zh') ? 'zh' : 'en'
          document.documentElement.setAttribute('data-home-locale', locale)
          document.documentElement.setAttribute('lang', locale)
        } catch {
          document.documentElement.classList.add('dark')
          document.documentElement.setAttribute('data-home-locale', 'en')
          document.documentElement.setAttribute('lang', 'en')
        }
      })()
    </script>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">rest2build</title>
  <desc id="desc">A crescent moon handing off to a terminal prompt: you rest, AI builds.</desc>
  <defs>
    <linearGradient id="r2b-bg" x1="72" y1="44" x2="442" y2="478" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F2445"/>
      <stop offset=".55" stop-color="#081530"/>
      <stop offset="1" stop-color="#050B14"/>
    </linearGradient>
    <radialGradient id="r2b-ambient" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(150 110) rotate(50) scale(360 400)">
      <stop stop-color="#14B8A6" stop-opacity=".32"/>
      <stop offset="1" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="r2b-brand" x1="120" y1="120" x2="420" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EEAD4"/>
      <stop offset=".5" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="r2b-glow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#r2b-bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#r2b-ambient)"/>
  <rect x="16.75" y="16.75" width="478.5" height="478.5" rx="119.25" fill="none" stroke="#7DD3FC" stroke-opacity=".18" stroke-width="1.5"/>

  <!-- crescent moon: rest -->
  <g filter="url(#r2b-glow)" transform="translate(24 -22) scale(0.9)">
    <path d="M214 118c-46 14-78 58-78 108 0 62 50 112 112 112 24 0 47-8 66-21-84 2-140-58-124-146 4-20 12-38 24-53z" fill="url(#r2b-brand)" opacity=".95"/>
  </g>
  <!-- zzz -->
  <g fill="none" stroke="url(#r2b-brand)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity=".9">
    <path d="M300 112h34l-34 34h34"/>
    <path d="M350 168h24l-24 24h24" opacity=".7"/>
  </g>

  <!-- terminal prompt: build -->
  <g fill="none" stroke="url(#r2b-brand)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#r2b-glow)">
    <path d="M136 300l58 52-58 52"/>
    <path d="M226 404h150"/>
  </g>
</svg>

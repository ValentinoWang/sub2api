[Unit]
After=xui-sales-sub2api-tunnel.service
Wants=xui-sales-sub2api-tunnel.service

[Service]
LoadCredential=sub2api_admin_api_key:/etc/xui-sales/sub2api-admin-api-key
Environment=SUB2API_ENABLED=true
Environment=SUB2API_BASE_URL=http://127.0.0.1:19080
Environment=SUB2API_ADMIN_API_KEY_FILE=/run/credentials/xui-sales-recover.service/sub2api_admin_api_key
Environment=SUB2API_TIMEOUT_SECONDS=8

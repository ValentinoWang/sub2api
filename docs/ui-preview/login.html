<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>登录 · rest2build 静态预览</title><link rel="stylesheet" href="style.css"></head>
<body><main class="auth-layout"><section class="auth-aside"><a class="brand" href="index.html"><span class="brand-mark">r2</span>rest2build</a><div><p class="eyebrow" style="color:#d6ec9d">MODEL ACCESS</p><h1>让工作流停在你手上，<em>让 AI 继续 build。</em></h1><p class="lead">面向 Codex、Claude Code 等工具的模型接入服务与经验分享。</p><p class="auth-note">此表单只演示页面反馈。不会验证邮箱、保存密码或建立真实会话。</p></div><small>静态预览 · 无真实凭证</small></section><section class="auth-form-wrap"><form class="auth-form" id="login-form"><p class="eyebrow">WELCOME BACK</p><h2>登录工作台</h2><p>使用演示字段查看交互状态。</p><div class="field"><label for="email">邮箱</label><input id="email" type="email" placeholder="you@example.com" autocomplete="off"></div><div class="field"><label for="password">密码</label><input id="password" type="password" placeholder="仅作显示，不会提交" autocomplete="off"></div><div class="form-row"><label><input type="checkbox"> 记住此演示选择</label><a href="index.html">返回预览首页</a></div><button class="button" type="submit" style="width:100%">显示本地演示反馈</button><p class="form-message" id="form-message" role="status" aria-live="polite"></p></form></section></main><script>document.getElementById('login-form').addEventListener('submit', function (event) { event.preventDefault(); document.getElementById('form-message').textContent = '演示已完成：未发送账号信息，也没有创建登录会话。'; });</script></body></html>

name: xui-sales CI

on:
  pull_request:
    paths:
      - "services/xui-sales/**"
      - ".github/workflows/xui-sales-ci.yml"
  push:
    paths:
      - "services/xui-sales/**"
      - ".github/workflows/xui-sales-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/xui-sales/requirements.txt
      - run: python -m pip install --requirement services/xui-sales/requirements.txt
      - run: make test-xui-sales

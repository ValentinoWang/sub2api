name: Codex Memory Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing Codex Memory tag (optional hosted verification only)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Test CLI and release artifacts
        run: python -m unittest discover -v -s tools/codex-memory-unifier -p "test_*.py"

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Resolve and validate version
        id: version
        shell: bash
        run: |
          TAG_NAME="${{ github.event.inputs.tag || github.ref_name }}"
          case "$TAG_NAME" in
            codex-memory-v*) ;;
            *) echo "invalid Codex Memory tag: $TAG_NAME" >&2; exit 1 ;;
          esac
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=${TAG_NAME#codex-memory-v}" >> "$GITHUB_OUTPUT"
      - name: Build deterministic release assets
        run: |
          python3 tools/codex-memory-unifier/build_release.py \
            --version "${{ steps.version.outputs.version }}" \
            --repository "${{ github.repository }}" \
            --output codex-memory-dist
      - name: Verify the committed website manifest
        run: cmp codex-memory-dist/codex-memory-release-manifest.json frontend/public/codex-memory-release-manifest.json
      - name: Attest release assets
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: 'codex-memory-dist/*'
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            codex-memory-dist/* \
            --verify-tag \
            --title "Codex Memory ${{ steps.version.outputs.version }}" \
            --notes "Provider-independent local Codex memory unifier for macOS, Windows, and Linux. Verify SHA-256 checksums before use."

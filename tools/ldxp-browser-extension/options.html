<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="ui.css"><title>管理补货绑定</title></head><body class="options"><header><p class="eyebrow">小铺补货助手</p><h1>绑定补货设备</h1><p>每项绑定独立记录站点、设备和商品。小铺登录仅保留在当前浏览器。</p></header><main><p id="feedback" role="status" aria-live="polite"></p><form id="form"><label>绑定站点<select name="site"><option value="https://ai.rest2build.lol">生产 · https://ai.rest2build.lol</option><option value="http://127.0.0.1:8080">本地 · http://127.0.0.1:8080</option></select></label><label>补货专用设备凭据<input name="device_key" type="password" required autocomplete="new-password" spellcheck="false"></label><p class="help">从站点的 Chrome 补货设备管理中获取。不要填写管理员密钥或小铺登录凭据。保存后不再显示凭据。</p><button type="button" id="inspect" class="secondary">读取绑定商品</button><label id="product-label" hidden>选择商品<select name="goods_id"></select></label><button type="submit" disabled>核对并保存绑定</button></form><h2 class="section-title">当前绑定</h2><div id="bindings"></div><p class="help">保存后在扩展弹窗中检查库存，再点击开始。暂停并核实待处理批次后，才能移除绑定。</p></main><script type="module" src="options.js"></script></body></html>
